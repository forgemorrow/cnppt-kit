name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip setuptools && python -m pip install -e ".[dev]"
      - name: Run pytest suite
        run: pytest -q
      - name: Run CJK linter & build benchmark
        run: python scripts/benchmark_linter.py
      - name: Smoke-test CLI build for domestic demo outlines
        run: |
          python -m cnppt_kit.cli build examples/defense_outline.md -o out-defense.pptx --html out-defense.html
          python -m cnppt_kit.cli build examples/pitch_outline.md -o out-pitch.pptx
          python -m cnppt_kit.cli build examples/report_outline.md -o out-report.pptx
